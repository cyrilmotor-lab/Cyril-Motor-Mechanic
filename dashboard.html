<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="stylesheet" href="dashboard.css?v=20260914"><title>Cyril Motor Dashboard</title><style>[hidden]{display:none!important}</style></head>
<body>
<div id="login" class="screen"><div class="panel"><div class="logo">CM</div><h1>Cyril Motor</h1><p>Workshop Dashboard</p><form id="loginForm"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button><button type="button" id="signup">Create account</button><button type="button" id="forgot">Forgot password?</button><div id="loginStatus"></div></form></div></div>
<div id="recovery" class="screen" hidden><div class="panel"><div class="logo">CM</div><h1>Set new password</h1><p>Choose a new password for the workshop dashboard.</p><form id="recoveryForm"><input name="password" type="password" placeholder="New password" minlength="8" required><input name="confirm" type="password" placeholder="Confirm new password" minlength="8" required><button>Update password</button><div id="recoveryStatus"></div></form></div></div>
<div id="app" hidden><header><div><b>Cyril Motor</b><small>Workshop Dashboard</small></div><button id="logout">Log out</button></header><main><div class="top"><div><p>WORKSHOP</p><h1>Dashboard</h1></div><button id="refresh">↻ Refresh</button></div><div class="stats"><div><small>Pending</small><strong id="pending">0</strong></div><div><small>Confirmed</small><strong id="confirmed">0</strong></div><div><small>In progress</small><strong id="progress">0</strong></div><div><small>Ready</small><strong id="ready">0</strong></div></div><section><h2>Upcoming bookings</h2><div id="bookings" class="list"></div></section></main></div>
<script src="config.js?v=20260914"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient(window.CYRIL_CONFIG.supabaseUrl,window.CYRIL_CONFIG.publishableKey);
const login=document.getElementById('login'),app=document.getElementById('app'),recovery=document.getElementById('recovery'),list=document.getElementById('bookings'),loginStatus=document.getElementById('loginStatus');
const setStatus=m=>loginStatus.textContent=m;
function showApp(){login.hidden=true;recovery.hidden=true;app.hidden=false;setStatus('');load();}
async function load(){list.textContent='Loading bookings…';const {data,error}=await sb.from('bookings').select('id,service,preferred_date,preferred_time,status,notes,created_at,customers(full_name,phone,email),vehicles(registration,make,model,year)').order('preferred_date',{ascending:true}).order('preferred_time',{ascending:true}).limit(100);if(error){list.textContent='Unable to load bookings: '+error.message;return}const counts={pending:0,confirmed:0,in_progress:0,ready:0};(data||[]).forEach(b=>counts[b.status]=(counts[b.status]||0)+1);for(const [k,id] of Object.entries({pending:'pending',confirmed:'confirmed',in_progress:'progress',ready:'ready'}))document.getElementById(id).textContent=counts[k]||0;list.innerHTML=data?.length?data.map(b=>`<article class="booking"><div><span class="status">${esc(b.status)}</span><h3>${esc(b.customers?.full_name||'Customer')} — ${esc(b.vehicles?.registration||'No rego')}</h3><p>${esc(b.service)} · ${esc(b.preferred_date)} · ${esc(b.preferred_time||'')}</p><p>${esc([b.vehicles?.make,b.vehicles?.model,b.vehicles?.year].filter(Boolean).join(' '))} · ${esc(b.customers?.phone||'')}</p><p>${esc(b.notes||'')}</p></div><div class="actions"><select data-id="${b.id}">${['pending','confirmed','in_progress','ready','completed','cancelled'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></div></article>`).join(''):'<div class="booking">No bookings yet.</div>';list.querySelectorAll('select').forEach(s=>s.addEventListener('change',async e=>{const {error}=await sb.from('bookings').update({status:e.target.value}).eq('id',e.target.dataset.id);if(error)alert(error.message);else load()}));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();setStatus('Signing in…');const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){setStatus(error.message);return}if(data?.session){showApp()}else{setStatus('Signed in, but no session was returned.');}});
document.getElementById('signup').addEventListener('click',async()=>{const f=new FormData(document.getElementById('loginForm'));const {error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password')});setStatus(error?error.message:'Account created. Check your email if confirmation is enabled.')});
document.getElementById('forgot').addEventListener('click',async()=>{const email=document.querySelector('#loginForm input[name="email"]').value.trim();if(!email){setStatus('Enter your email address first.');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});setStatus(error?error.message:'Password reset email sent. Check your email.')});
document.getElementById('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const out=document.getElementById('recoveryStatus');if(f.get('password')!==f.get('confirm')){out.textContent='Passwords do not match.';return}const {error}=await sb.auth.updateUser({password:f.get('password')});if(error){out.textContent=error.message;return}out.textContent='Password updated. You can now sign in.';await sb.auth.signOut();recovery.hidden=true;login.hidden=false});
document.getElementById('logout').addEventListener('click',()=>sb.auth.signOut());document.getElementById('refresh').addEventListener('click',load);
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){login.hidden=true;app.hidden=true;recovery.hidden=false;return}if(session){showApp()}else{login.hidden=false;recovery.hidden=true;app.hidden=true}});
sb.auth.getSession().then(({data})=>{if(data?.session)showApp()});
</script></body></html>
