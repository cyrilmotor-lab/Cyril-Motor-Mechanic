<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="stylesheet" href="dashboard.css"><title>Reset Password — Cyril Motor</title></head>
<body>
<div id="recovery" class="screen"><div class="panel"><div class="logo">CM</div><h1>Set new password</h1><p>Choose a new password for the workshop dashboard.</p><form id="recoveryForm"><input name="password" type="password" placeholder="New password" minlength="8" required><input name="confirm" type="password" placeholder="Confirm new password" minlength="8" required><button>Update password</button><div id="status"></div></form></div></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const cfg=window.CYRIL_CONFIG;
const sb=createClient(cfg.supabaseUrl,cfg.publishableKey);
const status=document.querySelector('#status');
let recoveryReady=false;
function ready(){recoveryReady=true;document.querySelector('#recoveryForm').hidden=false;}
document.querySelector('#recoveryForm').hidden=true;
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){ready()}});
(async()=>{await sb.auth.getSession(); if(window.location.hash.includes('access_token=')) setTimeout(()=>{if(!recoveryReady) ready()},500)})();
document.querySelector('#recoveryForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const p=f.get('password'),c=f.get('confirm');if(p!==c){status.textContent='Passwords do not match.';return}const {error}=await sb.auth.updateUser({password:p});if(error){status.textContent=error.message;return}status.textContent='Password updated successfully. Returning to login…';await sb.auth.signOut();setTimeout(()=>location.href='/dashboard.html',1200)});
</script><script src="config.js"></script></body></html>
