<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Book a Service | Cyril Motor Mechanic</title><link rel="stylesheet" href="styles.css?v=20260914-1"><style>body{background:#f3f3f1;color:#111;font-family:Inter,system-ui,sans-serif}.bookingPage{max-width:720px;margin:0 auto;padding:45px 20px 100px}.bookingPanel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;box-shadow:0 10px 30px #0001}.bookingPage h1{font-size:42px;margin:0 0 8px}.bookingPage>p{color:#666;margin:0 0 25px}.bookingForm{display:grid;gap:14px}.bookingForm label{font-weight:700;font-size:14px}.bookingForm input,.bookingForm select,.bookingForm textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font:inherit;margin-top:6px;background:#fff}.bookingForm textarea{min-height:110px;resize:vertical}.bookingForm button{padding:15px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:800;font-size:16px}.success,.error{padding:14px;border-radius:9px;margin-top:10px}.success{background:#e9f7ed}.error{background:#fdecec}.back{display:inline-block;margin-bottom:22px;color:#111;font-weight:800;text-decoration:none}.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}</style></head><body><main class="bookingPage"><a class="back" href="/">← Cyril Motor Mechanic</a><div class="bookingPanel"><h1>Book a Service</h1><p>Choose your preferred date and time and send us your vehicle details. We’ll receive your request instantly.</p><form id="bookingForm" class="bookingForm"><label>Full name<input name="name" required maxlength="120" autocomplete="name"></label><label>Mobile number<input name="phone" required maxlength="30" inputmode="tel" autocomplete="tel"></label><label>Email (optional)<input name="email" type="email" maxlength="160" autocomplete="email"></label><label>Registration / Rego<input name="registration" required maxlength="20" autocomplete="off"></label><label>Vehicle (make & model)<input name="vehicle" required maxlength="120" placeholder="e.g. Toyota Hilux 2.8" autocomplete="off"></label><label>Service required<select name="service" required><option value="">Select a service</option><option>Minor Service</option><option>Major Service</option><option>Logbook Service</option><option>Brake Repairs</option><option>Engine Diagnostics</option><option>Suspension & Steering</option><option>Auto Electrical</option><option>Air Conditioning</option><option>Engine Repairs</option><option>Transmission Servicing</option><option>Pink Slip (Safety Check)</option><option>Blue Slip (Advanced)</option><option>ECU Diagnostics & Tuning</option><option>Diesel Performance Upgrades</option><option>DPF, EGR & Ad-Blue Solutions</option><option>4x4 & Off Road Upgrades</option><option>Pre-Purchase Inspection</option><option>Clutch & Drivetrain</option><option>Other</option></select></label><label>Preferred date<input name="date" type="date" required></label><label>Preferred time<input name="time" type="time" required></label><label>Notes / extra details<textarea name="notes" maxlength="1500" placeholder="Tell us anything we should know about the vehicle or issue."></textarea></label><div class="hp"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><button type="submit">SUBMIT BOOKING</button><div id="result" aria-live="polite"></div></form></div></main><script src="config.js?booking=20260914-2"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient(window.CYRIL_CONFIG.supabaseUrl,window.CYRIL_CONFIG.publishableKey);const form=document.querySelector('#bookingForm'),result=document.querySelector('#result'),date=form.elements.date;const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());date.min=d.toISOString().slice(0,10);form.addEventListener('submit',async e=>{e.preventDefault();result.className='';result.textContent='Sending booking…';try{const body=Object.fromEntries(new FormData(form).entries());const r=await fetch(window.CYRIL_CONFIG.supabaseUrl+'/functions/v1/create-booking',{method:'POST',headers:{'Content-Type':'application/json','apikey':window.CYRIL_CONFIG.publishableKey},body:JSON.stringify(body)});let data=null;try{data=await r.json()}catch{}if(!r.ok||!data?.ok){result.className='error';result.textContent=data?.error||'We could not send the booking. Please call 02 8809 5483.';return}result.className='success';result.textContent='Booking received! Your request has been sent to Cyril Motor Mechanic. We will confirm your appointment shortly.';form.reset();date.min=d.toISOString().slice(0,10)}catch(err){result.className='error';result.textContent='Connection error. Please call 02 8809 5483.'}});</script></body></html>
